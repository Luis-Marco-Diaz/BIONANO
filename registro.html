<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro | YoCoCreo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 420px;
      margin: 60px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 22px;
      text-align: center;
    }
    p {
      font-size: 14px;
      text-align: center;
      color: #555;
    }
    input[type="email"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #f57c00;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Registro</h1>
  <p>Ingresa tu correo electrónico para comenzar.</p>

  <!-- FORMULARIO -->
  <form
    id="registroForm"
    method="POST"
    action="https://script.google.com/macros/s/AKfycbyroo5echAuitnnOrV6Oh_u-e_oxjOd9XNjhfBAefsHA-Fz7IjhxDyCLmXsolOrkny5ug/exec"
    target="hidden_iframe"
  >
    <input
      type="email"
      name="email"
      required
      placeholder="tucorreo@ejemplo.com"
    >
    <button type="submit">Enviar</button>
  </form>
</div>

<!-- IFRAME OCULTO -->
<iframe
  name="hidden_iframe"
  style="display:none;"
></iframe>

<script>
  const form = document.getElementById('registroForm');

  form.addEventListener('submit', function () {
    // Espera mínima para asegurar envío
    setTimeout(function () {
      window.location.href = "https://yococreo.org/revisa-tu-correo";
    }, 800);
  });
</script>

</body>
</html>
