<div class="yc-registro-wrapper">
  <h2>Aquí inicia el registro completo de la empresaria</h2>
  <p>Ingresa toda la información de tu empresa para completar el registro.</p>

  <form id="yc-form">
    <input
      type="email"
      id="yc-email"
      placeholder="tu@correo.com"
      required
    />
    <button type="submit" id="yc-btn">Continuar</button>
  </form>

  <p id="yc-msg" class="yc-msg"></p>
</div>
